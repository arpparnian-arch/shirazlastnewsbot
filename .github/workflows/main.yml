name: Run News Bot

on:
schedule:
- cron: '*/5 * * * *'
workflow_dispatch:

permissions:
contents: write

jobs:
build:
runs-on: ubuntu-latest
steps:
- name: Checkout repo
uses: actions/checkout@v4

- name: Set up Python
uses: actions/setup-python@v5
with:
python-version: '3.11'

- name: Install libraries
run: pip install pyTelegramBotAPI requests feedparser beautifulsoup4 urllib3

- name: Run bot
run: python bot.py

- name: Save sent links
run: |
git config --global user.name "Bot"
git config --global user.email "bot@noreply.github.com"
git add sent_links.txt || true
git diff --staged --quiet || git commit -m "Update sent news"
git push || true
