{
"name": "Run News Bot",
"on": {
"schedule": [
{ "cron": "*/5 * * * *" }
],
"workflow_dispatch": null
},
"permissions": {
"contents": "write"
},
"jobs": {
"build": {
"runs-on": "ubuntu-latest",
"steps": [
{
"name": "Checkout repo",
"uses": "actions/checkout@v4"
},
{
"name": "Set up Python",
"uses": "actions/setup-python@v5",
"with": {
"python-version": "3.11"
}
},
{
"name": "Install libraries",
"run": "pip install pyTelegramBotAPI requests feedparser beautifulsoup4 urllib3 Pillow"
},
{
"name": "Run bot",
"run": "python bot.py"
},
{
"name": "Save state",
"run": "git config --global user.name 'Bot' && git config --global user.email 'bot@noreply.github.com' && (git add sent_links.txt daily_report.txt || true) && (git diff --staged --quiet || git commit -m 'Update bot memory') && (git push || true)"
}
]
}
}
}
