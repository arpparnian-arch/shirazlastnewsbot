name: Run News Bot

on:
  schedule:
    # اجرا در هر ۲۰ دقیقه در ساعات بیداری ایران
    - cron: '*/20 3-20 * * *'
  workflow_dispatch:

concurrency:
  group: shiraz-news-live-runner
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg, Fonts and Libraries (Fail-Safe Mode)
        run: |
          # اگر ffmpeg از قبل روی سرور گیت‌هاب نصب است، وقت را تلف نکن؛ وگرنه با تایم‌اوت کوتاه تلاش کن
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout="10" update || true
            sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout="10" install -y ffmpeg fonts-vazirmatn fonts-dejavu-core libraqm0 || true
          fi
          # دانلود مستقیم فونت وزیرمتن در پوشه سیستم تا به apt نیازی نباشد
          sudo mkdir -p /usr/share/fonts/truetype/vazirmatn
          sudo curl -sL https://github.com/rastikerdar/vazirmatn/raw/master/fonts/ttf/Vazirmatn-Bold.ttf -o /usr/share/fonts/truetype/vazirmatn/Vazirmatn-Bold.ttf || true
          pip install --upgrade pip
          pip install pyTelegramBotAPI requests feedparser beautifulsoup4 urllib3 Pillow edge-tts instagrapi moviepy imageio-ffmpeg

      - name: Run bot (Continuous Drip-Feed Mode)
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          IG_SESSIONID: ${{ secrets.IG_SESSIONID }}
          GH_PAT_TOKEN: ${{ secrets.GH_PAT_TOKEN }}
        run: python bot.py

      - name: Save state
        if: always()
        run: |
          git config --global user.name "Bot"
          git config --global user.email "bot@noreply.github.com"
          mkdir -p drafts logos_cache
          touch sent_links.txt sent_titles_hash.txt insta_titles_hash.txt daily_report.txt night_report_v8.txt matches_story_date.txt tourism_post_state.txt today_titles.txt insta_log.txt insta_reel_log.txt service_bot_data.json live_iran_league_state.json
          git add -f *.txt service_bot_data.json live_iran_league_state.json insta_session.json *.jpg drafts/ logos_cache/ || true
          git diff --staged --quiet || git commit -m "Update bot memory"
          git pull --rebase || true
          git push || true
