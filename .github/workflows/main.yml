name: Run News Bot

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: shiraz-news-live-runner
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg, Fonts and Libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-vazirmatn fonts-dejavu-core libraqm0
          pip install pyTelegramBotAPI requests feedparser beautifulsoup4 urllib3 Pillow edge-tts instagrapi moviepy

      - name: Run bot (Continuous Drip-Feed Mode)
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          INSTA_USER: ${{ secrets.INSTA_USER }}
          INSTA_PASS: ${{ secrets.INSTA_PASS }}
        run: python bot.py

      - name: Save state
        if: always()
        run: |
          git config --global user.name "Bot"
          git config --global user.email "bot@noreply.github.com"
          mkdir -p drafts logos_cache
          touch sent_links.txt sent_titles_hash.txt insta_titles_hash.txt daily_report.txt night_report_v8.txt matches_story_date.txt tourism_post_state.txt today_titles.txt insta_log.txt insta_reel_log.txt service_bot_data.json live_iran_league_state.json
          git rm --cached insta_session.json || true
          git add -f *.txt service_bot_data.json live_iran_league_state.json *.jpg drafts/ logos_cache/ || true
          git diff --staged --quiet || git commit -m "Update bot memory"
          git pull --rebase || true
          git push || true
